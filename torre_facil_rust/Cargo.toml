[package]
name = "torre_facil"
version = "10.0.0"
edition = "2021"
description = "Torre Fácil ERP — pacote modular (porta Rust 1:1 do Python) de análise de estações SMP/Anatel"
author = ["Seu Nome <seu.email@exemplo.com>"]
license = "MIT"


[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
libc = "0.2"
tempfile = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
ureq = "3.4.2"

[profile.release]
opt-level = 3

[dev-dependencies]
tempfile = "3"
